<text x="702.0" y="342.0" font-size="11" text-anchor="start" fill="#1f2329" font-weight="normal">en 127.0.0.1:502</text>
<text x="972.0" y="326.0" font-size="11" text-anchor="start" fill="#1f2329" font-weight="normal">Servidor modbus-serial</text>
<text x="972.0" y="342.0" font-size="11" text-anchor="start" fill="#1f2329" font-weight="normal">en 127.0.0.1:5020</text>
<text x="660.0" y="388.0" font-size="11" text-anchor="start" fill="#5f6873" font-weight="normal" font-style="italic">En la emulación no hay módulos físicos: las imágenes de E/S se intercambian por</text>
<text x="660.0" y="405.0" font-size="11" text-anchor="start" fill="#5f6873" font-weight="normal" font-style="italic">Modbus con el middleware, y la planta 3D hace de proceso (sensores y actuadores).</text>
