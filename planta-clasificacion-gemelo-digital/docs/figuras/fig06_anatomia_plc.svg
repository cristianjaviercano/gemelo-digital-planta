<text x="702.0" y="164.0" font-size="11" text-anchor="start" fill="#1f2329" font-weight="normal">Runtime IEC 61131-3: ejecuta los .st</text>
<text x="702.0" y="180.0" font-size="11" text-anchor="start" fill="#1f2329" font-weight="normal">compilados en la MainTask de 10 ms</text>
<text x="972.0" y="164.0" font-size="11" text-anchor="start" fill="#1f2329" font-weight="normal">clasificador.js, traducción 1:1 de</text>
<text x="972.0" y="180.0" font-size="11" text-anchor="start" fill="#1f2329" font-weight="normal">los .st; tarea de 10 ms (setInterval)</text>
<rect x="660.0" y="198.0" width="574.0" height="54.0" rx="0" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/>
<circle cx="677.0" cy="225.0" r="10" fill="#1f2329" stroke="#1f2329" stroke-width="1"/>
