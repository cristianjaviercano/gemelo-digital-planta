<text x="702.0" y="288.0" font-size="11" text-anchor="start" fill="#1f2329" font-weight="normal">leídos por el middleware</text>
<text x="972.0" y="272.0" font-size="11" text-anchor="start" fill="#1f2329" font-weight="normal">Igual: discrete inputs 0–6</text>
<rect x="660.0" y="306.0" width="574.0" height="54.0" rx="0" fill="#ffffff" stroke="#cdd3da" stroke-width="1"/>
<circle cx="677.0" cy="333.0" r="10" fill="#1f2329" stroke="#1f2329" stroke-width="1"/>
<text x="677.0" y="337.0" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">5</text>
