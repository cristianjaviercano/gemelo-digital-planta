<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" width="1240" height="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Arquitectura de tres capas del sistema">
<title>Arquitectura de tres capas del sistema</title>
<defs>
  <marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
