<line x1="520.0" y1="640.0" x2="520.0" y2="650.0" stroke="#2c6fb7" stroke-width="1.6"/>
<text x="1067.2" y="350.0" font-size="10" text-anchor="start" fill="#2c6fb7" font-weight="normal" font-style="italic">150 ms</text>
<text x="640.0" y="712.0" font-size="12" text-anchor="middle" fill="#5f6873" font-weight="normal" font-style="italic">El pulso de 150 ms supera T_scan + T_p = 60 ms: el PLC lo detecta en el ciclo siguiente (30 ms) y la lectura de retorno lo registra a los 50, 100 y 150 ms.</text>
<text x="640.0" y="732.0" font-size="12" text-anchor="middle" fill="#5f6873" font-weight="normal" font-style="italic">La HMI ve el cambio en la lectura de los 50 ms: 27 ms después de la orden, dentro del presupuesto de latencia de ≈ 79 ms (docs/01 §6.1).</text>
